name: CI

on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # The host the plugin is tested against: a released bddkit, installed from
  # its tag and never from a floating branch, so a red run means this plugin
  # broke. Raise it when a newer release is out.
  HOST_TAG: v0.5.0

jobs:
  test:
    name: test & clippy (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # One adapter per OS family (src/exec/unix.rs, src/exec/windows.rs);
        # each is exercised on real processes by the unit and export tests.
        os: [ubuntu-latest, macos-15, windows-latest]
    steps:
      - uses: actions/checkout@v6
      # Pinned on purpose: a floating stable's new clippy lint must never
      # redden a PR that has nothing to do with it.
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: "1.97.1"
          components: clippy, rustfmt
          rustflags: ""
      - run: cargo fmt --check
      # A file is as long on every OS, and this script is bash, which
      # windows-latest does not default to.
      - name: File size budget
        if: runner.os == 'Linux'
        run: |
          files=$(git ls-files '*.rs' '*.feature' '*.yaml' '*.yml' ':!.github/')
          status=0
          while IFS= read -r file; do
            lines=$(wc -l < "$file")
            if [ "$lines" -gt 1000 ]; then
              echo "::error file=$file::$lines lines, the limit is 1000"
              status=1
            fi
          done <<< "$files"
          exit "$status"
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test --locked --lib --test exports

  e2e:
    name: e2e against bddkit (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-15, windows-latest]
    steps:
      - uses: actions/checkout@v6
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: "1.97.1"
          rustflags: ""
      # The host comes from the pinned HOST_TAG, never a floating branch: a red
      # run here must mean this plugin broke.
      - name: Cache the host
        id: host
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/bddkit-host
          key: bddkit-host-${{ env.HOST_TAG }}-${{ runner.os }}
      - name: Install bddkit
        if: steps.host.outputs.cache-hit != 'true'
        shell: bash
        run: >-
          cargo install --git https://github.com/bddkit/bddkit --tag "$HOST_TAG"
          --locked --root "$RUNNER_TEMP/bddkit-host" bddkit
      - name: Use the host
        shell: bash
        run: |
          echo "$RUNNER_TEMP/bddkit-host/bin" >> "$GITHUB_PATH"
          exe=; [ "$RUNNER_OS" = Windows ] && exe=.exe
          echo "BDDKIT_BIN=$RUNNER_TEMP/bddkit-host/bin/bddkit$exe" >> "$GITHUB_ENV"
      # The example and negative features are written for a POSIX shell;
      # on Windows they run under Git Bash, which the runner image ships.
      # examples/windows.yaml covers cmd.exe and PowerShell.
      - name: Use Git Bash for the POSIX features
        if: runner.os == 'Windows'
        shell: bash
        run: echo "EXEC_SHELL=C:/Program Files/Git/bin/bash.exe" >> "$GITHUB_ENV"
      - name: End-to-end
        run: cargo test --locked --test e2e -- --nocapture
