# The demo suite. `paths` resolves against this file's folder (bddkit 0.6.0 or
# newer). The features are written for a POSIX shell; on Windows point
# EXEC_SHELL at Git Bash, e.g.
# EXEC_SHELL="C:/Program Files/Git/bin/bash.exe". On Windows run only
# examples/features: examples/posix needs SIGTERM and SIGINT.
paths: [features, posix]
resources:
  exec:
    local:                   # cwd and timeout: the defaults
      shell: ${EXEC_SHELL:-sh}
      stop_grace_secs: 5     # default 2; how long `I stop` waits for a clean shutdown
      env:
        GREETING: hello
    tools:
      shell: ${EXEC_SHELL:-bash}
      timeout_secs: 5
      max_output_bytes: 65536
default_exec: local
