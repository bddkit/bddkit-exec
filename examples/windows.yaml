# Windows only: the shells a suite reaches without Git Bash. `paths` resolves
# against this file's folder, like in examples/exec.yaml.
paths: [windows]
resources:
  exec:
    cmd: {}            # the default shell on Windows: cmd /S /C "<command>"
    ps:
      shell: powershell   # powershell -NoProfile -Command <command>
default_exec: cmd
