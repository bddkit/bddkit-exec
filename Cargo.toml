[package]
name = "bddkit-exec"
version = "0.3.0"
edition = "2024"
rust-version = "1.97"
description = "Local command steps for the bddkit acceptance-testing tool: run commands, stream processes, validate their output"
license = "Apache-2.0"
repository = "https://github.com/sergeym/bddkit-exec"
homepage = "https://github.com/sergeym/bddkit-exec"
readme = "README.md"
keywords = ["bdd", "gherkin", "testing", "process", "bddkit"]
categories = ["development-tools::testing"]
exclude = ["/.github", "/.idea", "/docs"]

[lib]
# rlib beside the cdylib so `tests/exports.rs` can call the exports in-process.
crate-type = ["cdylib", "rlib"]

[dependencies]
serde_json = "1.0"
regex = "1.13"

# The process-tree adapters in src/exec/: a process group on Unix, a Job
# Object on Windows.
[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_Console",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_JobObjects",
    "Win32_System_Threading",
] }

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
unwrap_used = "warn"
expect_used = "warn"
panic = "warn"
todo = "warn"
unimplemented = "warn"
dbg_macro = "warn"
clone_on_ref_ptr = "warn"
undocumented_unsafe_blocks = "warn"
multiple_unsafe_ops_per_block = "warn"
# noise for this project
module_name_repetitions = "allow"
must_use_candidate = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
doc_markdown = "allow"
format_push_string = "allow"
